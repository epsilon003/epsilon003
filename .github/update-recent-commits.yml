name: Update recent commits

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh recent commits in profile README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = 'epsilon003';
            const profileRepo = 'epsilon003';
            const markerStart = '<!--START_SECTION:recent-commits-->';
            const markerEnd = '<!--END_SECTION:recent-commits-->';

            const events = await github.paginate(
              github.rest.activity.listPublicEventsForUser,
              { username, per_page: 100 }
            );

            const commits = [];
            const seen = new Set();

            for (const event of events) {
              if (event.type !== 'PushEvent') continue;
              const [owner, repo] = event.repo.name.split('/');
              if (owner === username && repo === profileRepo) continue;

              const sha = event.payload?.head;
              if (!sha || seen.has(`${event.repo.name}:${sha}`)) continue;
              seen.add(`${event.repo.name}:${sha}`);

              try {
                const response = await github.rest.repos.getCommit({ owner, repo, ref: sha });
                const commit = response.data.commit;
                const message = commit.message.split('\n')[0].trim();
                const date = commit.author?.date || commit.committer?.date || event.created_at;

                commits.push({
                  date: new Date(date),
                  dateText: new Intl.DateTimeFormat('en', {
                    year: 'numeric', month: 'short', day: 'numeric'
                  }).format(new Date(date)),
                  repo: event.repo.name,
                  repoUrl: `https://github.com/${event.repo.name}`,
                  message,
                  url: response.data.html_url
                });
              } catch (error) {
                core.warning(`Could not read ${event.repo.name}@${sha}: ${error.message}`);
              }

              if (commits.length >= 8) break;
            }

            commits.sort((a, b) => b.date - a.date);

            const body = commits.length
              ? [
                  '| Date | Repository | Commit |',
                  '| :--- | :--- | :--- |',
                  ...commits.map(item => `| ${item.dateText} | [${item.repo}](${item.repoUrl}) | [${item.message.replaceAll('|', '\\|')}](${item.url}) |`)
                ].join('\n')
              : '_No recent public commits found yet._';

            const replacement = `${markerStart}\n${body}\n${markerEnd}`;
            const file = await github.rest.repos.getContent({ owner: username, repo: profileRepo, path: 'README.md' });
            const current = Buffer.from(file.data.content, 'base64').toString('utf8');

            if (!current.includes(markerStart) || !current.includes(markerEnd)) {
              core.setFailed('README markers were not found. Refusing to overwrite the README.');
              return;
            }

            const updated = current.replace(
              new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`),
              replacement
            );

            if (updated === current) {
              core.info('Recent commits are already up to date.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: username,
              repo: profileRepo,
              path: 'README.md',
              message: 'docs: update recent commits',
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: file.data.sha
            });

            core.info('Profile README recent commits updated.');
